<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areum Portfolio</title>
    <link href="pstyle.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendard-dynamic-subset.min.css" />
</head>
<body>
    
    <header class="nav">
        <div class="container nav-inner">
            <a class="logo" href="#">Areum</a>
            <nav class="menu">
                <a href="#">About</a>
                <a href="#">Project</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>

<!-- 히어로 섹션 -->

    <section class="container hero">
        <div class="hero">
            <h1 class="hero-title">매일 성장하는 디자이너 오아름 입니다</h1>
            <p class="hero-text">데헿 잘 부탁드려요</p>
        </div>
    </section>

<!-- 프로젝트 카드 -->

    <section class="container">
        <h2>프로젝트 리스트</h2>
        <div class="grid">
            <article class="card work-card">
                <img src="title page.jpg" alt="썸네일">
                <div class="work-body">
                    <h3>첫번째 프로젝트</h3>
                </div>
            </article>
            <article class="card work-card">
                <img src="title page.jpg" alt="썸네일">
                <div class="work-body">
                    <h3>두번째 프로젝트</h3>
                </div>
            </article>
            <article class="card work-card">
                <img src="title page.jpg" alt="썸네일">
                <div class="work-body">
                    <h3>세번째 프로젝트</h3>
                </div>
            </article>
        </div>
    </section>

<!-- 푸터영역 -->
     <footer class="container footer">
        <p class="copyright">&copy; 2026 Areum. All rights reserved.</p>
        <div class="link">
            <a href="#">Instagram</a>
            <a href="#">Behance</a>
            <a href="#">Notefolio</a>
        </div>
     </footer>  

</body>
</html>
